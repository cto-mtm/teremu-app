name: Integration tests

# See docs/testing-plan.md. One job, no real secrets: mock OCR (no
# NVIDIA_API_KEY), the `demo-app` emulator project, and an
# emulator-Stripe-less webhook check (the two STRIPE_* values written
# below are fixed placeholder strings, never real credentials — see
# firebase/functions/.secret.local's own comment for why the webhook
# test needs them).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # firebase-tools now requires a JDK 21+ runtime for the
      # Firestore/Storage emulators.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm install

      - run: npm install -g firebase-tools

      # Emulator-only placeholder secrets for the Stripe webhook test —
      # fixed test strings, not real credentials. Must match the
      # FAKE_WEBHOOK_SECRET constant in firebase/functions/test/billing.test.ts.
      - name: Write emulator-only Stripe test secrets
        run: |
          cat > firebase/functions/.secret.local <<'EOF'
          STRIPE_SECRET_KEY=sk_test_teremu_ci_fake_0000000000000000000000000000
          STRIPE_WEBHOOK_SECRET=whsec_teremu_ci_fake_0000000000000000000000000000
          EOF

      - run: npm run build:shared

      - name: Run integration tests against the Firebase emulators
        run: cd firebase && firebase emulators:exec --project demo-app "npm --prefix functions run test"
